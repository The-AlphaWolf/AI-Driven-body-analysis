name: Deploy backend to Hugging Face

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'deploy/huggingface/**'
      - '.github/workflows/deploy-space.yml'
  workflow_dispatch:

concurrency:
  group: deploy-space
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skipped automatically on forks and before the secrets are configured.
    if: ${{ github.repository_owner == 'The-AlphaWolf' }}

    steps:
      - uses: actions/checkout@v4

      - name: Push to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "::notice::HF_TOKEN or HF_SPACE not set — skipping deploy."
            exit 0
          fi
          git lfs install
          chmod +x deploy/huggingface/sync.sh
          ./deploy/huggingface/sync.sh "$HF_SPACE"
