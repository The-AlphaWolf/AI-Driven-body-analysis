# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploys the backend as a Docker service. The database lives on Neon rather
# than Render: Render's free Postgres expires after 30 days, and losing every
# account a month after launch is not a tradeoff worth making.
services:
  - type: web
    name: stylesense-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    healthCheckPath: /api/health

    envVars:
      - key: FLASK_ENV
        value: production

      # Render injects PORT; the container's start command honours it.

      # Generated by Render and never shown to anyone who does not open the
      # dashboard — the app refuses to boot in production without a real one.
      - key: JWT_SECRET_KEY
        generateValue: true

      # Set these two in the dashboard. DATABASE_URL carries a password, so it
      # deliberately does not live in this file.
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
